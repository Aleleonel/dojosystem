<!DOCTYPE html>
<html>

<head>
    <title>Dojo System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            height: 100vh;
            width: 240px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #111;
            padding-top: 20px;
        }

        .sidebar a {
            padding: 12px 20px;
            display: block;
            color: #ccc;
            text-decoration: none;
            font-weight: 500;
        }

        .sidebar a:hover {
            background-color: #00d1d2;
            color: #000;
        }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        .logo {
            color: #00d1d2;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a.active {
            background-color: #00d1d2;
            color: #000;
            border-left: 4px solid #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <a href="{% url 'dashboard' %}"
            class="{% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'home' %}active{% endif %}">
            📊 Dashboard
        </a>

        <a href="{% url 'lista_alunos' %}"
            class="{% if request.resolver_match.url_name == 'lista_alunos' %}active{% endif %}">
            🥋 Alunos
        </a>

        <a href="{% url 'leitor_qr' %}"
            class="{% if request.resolver_match.url_name == 'leitor_qr' %}active{% endif %}">
            📷 Leitor QR
        </a>

    </div>

    <!-- CONTEÚDO -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
