{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Dojo System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- BOTÃO MENU -->
    <button id="menu-btn" class="btn btn-dark m-2" onclick="toggleMenu()">☰</button>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">

        <div class="logo">DOJO SYSTEM</div>

        <a href="{% url 'dashboard' %}"
            class="{% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'home' %}active{% endif %}">
            📊 Dashboard
        </a>

        <a href="{% url 'lista_alunos' %}"
            class="{% if request.resolver_match.url_name == 'lista_alunos' %}active{% endif %}">
            🥋 Alunos
        </a>

        <a href="{% url 'leitor_qr' %}"
            class="{% if request.resolver_match.url_name == 'leitor_qr' %}active{% endif %}">
            📷 Leitor QR
        </a>

    </div>

    <!-- CONTEÚDO -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- JS -->
    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
