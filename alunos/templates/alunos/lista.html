{% extends 'base.html' %}

{% block content %}

<a href="{% url 'criar_aluno' %}" class="btn btn-success mb-3">Novo Aluno</a>

<table class="table table-striped">
    <tr>
        <th>Foto</th>
        <th>Nome</th>
        <th>Graduação</th>
        <th>Ações</th>
    </tr>

    {% for aluno in alunos %}
    <tr>
        <td>
            {% if aluno.foto %}
            <img src="{{ aluno.foto.url }}" width="50">
            {% endif %}
        </td>
        <td>{{ aluno.nome }}</td>
        <td>{{ aluno.get_graduacao_display }}</td>
        <td>
            <a href="{% url 'registrar_frequencia' aluno.id %}" class="btn btn-success btn-sm">
                Presença
            </a>
            <a href="{% url 'historico_frequencia' aluno.id %}" class="btn btn-info btn-sm">
                Histórico
            </a>

            <a href="{% url 'editar_aluno' aluno.id %}" class="btn btn-warning btn-sm">
                Editar
            </a>

            <a href="{% url 'deletar_aluno' aluno.id %}" class="btn btn-danger btn-sm">
                Excluir
            </a>
        </td>
        <td>
            {% if aluno.qr_code %}
            <img src="{{ aluno.qr_code.url }}" width="80">
            {% endif %}
        </td>

    </tr>
    {% endfor %}
</table>

{% endblock %}
